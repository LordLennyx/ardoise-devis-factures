<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ardoise — Devis et factures en deux minutes</title>
<meta name="description" content="Créez des devis et factures conformes (TVA 19,25 %, montant en lettres, acompte), aperçu A4 en direct, export PDF. Données conservées sur votre appareil.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d4f4a'/%3E%3Cpath d='M9 22h14M9 16h14M9 10h9' stroke='%23f3ede1' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#ebe6db;--ink:#1c1b18;--teal:#0d4f4a;--teal2:#d7e6e2;--paper:#fffdf8;--mute:#77736a;--line:#d9d3c5;--red:#b42318;--acc:#0d4f4a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.45 'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font:600 22px 'Newsreader';letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--teal);display:grid;place-items:center}
.logo i::after{content:"";width:13px;height:2px;background:#f3ede1;box-shadow:0 -5px 0 #f3ede1,0 5px 0 #f3ede1}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mute)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sp{flex:1}
.b{height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.b.p{background:var(--teal);color:#fff;border-color:var(--teal)}
.b svg{width:16px;height:16px}
.app{display:grid;grid-template-columns:440px 1fr;height:calc(100vh - 63px)}
.ed{overflow-y:auto;padding:18px 20px 60px;border-right:1px solid var(--line);background:#f4f0e7}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sec h3{font:600 11.5px 'Schibsted Grotesk';text-transform:uppercase;letter-spacing:.13em;color:var(--mute);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g .w{grid-column:1/-1}
label.f{display:grid;gap:3px;font-size:12px;color:var(--mute);font-weight:500}
.f input,.f select,.f textarea{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;font-size:14px;color:var(--ink);width:100%}
.f textarea{height:60px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
.lines{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:1fr 54px 92px 26px;gap:6px;align-items:start;background:#faf7f0;border:1px solid var(--line);border-radius:10px;padding:8px}
.ln input{height:32px;border:1px solid transparent;background:transparent;border-radius:6px;padding:0 6px;width:100%;font-size:13.5px}
.ln input:hover{border-color:var(--line)}.ln input:focus{background:#fff}
.ln .d{grid-column:1/2;font-size:12px;color:var(--mute);height:26px}
.ln input.n{text-align:right;font-variant-numeric:tabular-nums}
.ln .x{border:0;background:none;color:var(--mute);height:32px;font-size:18px;line-height:1}
.ln .x:hover{color:var(--red)}
.add{border:1.5px dashed var(--line);background:none;border-radius:10px;height:38px;width:100%;font-weight:600;color:var(--teal);margin-top:8px}
.add:hover{border-color:var(--teal)}
.cat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cat button{border:1px solid var(--line);background:#fff;border-radius:100px;padding:4px 10px;font-size:12px}
.cat button:hover{border-color:var(--teal);color:var(--teal)}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;padding:6px 0}
.tg{appearance:none;width:36px;height:21px;border-radius:20px;background:var(--line);position:relative;transition:.2s;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.tg:checked{background:var(--teal)}.tg:checked::after{left:18px}
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:12px;font-weight:600;display:grid;gap:6px}
.tpl button.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal2)}
.tpl i{height:34px;border-radius:5px;display:block;background:#f2efe8}
.tpl [data-t=classique] i{background:linear-gradient(#fff 0 0) 6px 6px/40% 4px no-repeat,linear-gradient(var(--acc) 0 0) 0 0/100% 3px no-repeat,#f7f4ee}
.tpl [data-t=bandeau] i{background:linear-gradient(var(--acc) 0 0) 0 0/100% 40% no-repeat,#f7f4ee}
.tpl [data-t=marge] i{background:linear-gradient(var(--acc) 0 0) 0 0/26% 100% no-repeat,#f7f4ee}
.cols{display:flex;gap:6px}
.cols button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.cols button.on{box-shadow:0 0 0 2px var(--ink)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute);cursor:pointer}
.drop img{max-height:34px;max-width:90px}

/* aperçu */
.pv{overflow:auto;padding:28px;display:flex;justify-content:center;align-items:flex-start;position:relative}
.scale{transform-origin:top center}
.page{width:794px;min-height:1123px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 30px 60px -30px rgba(40,30,10,.35);position:relative;color:#1c1b18;font:400 12.5px/1.5 'Schibsted Grotesk';display:flex;flex-direction:column}
.page .in{padding:56px 60px 40px;flex:1;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.em b{font-size:15px;display:block;font-weight:700;margin-bottom:2px}
.em{color:#57534a;font-size:11.5px;line-height:1.55}
.em img{max-height:52px;max-width:160px;margin-bottom:10px;display:block}
.tt{text-align:right}
.tt h1{font:500 44px/1 'Newsreader';letter-spacing:-.02em;color:var(--acc)}
.tt .num{font:500 12px 'Schibsted Grotesk';margin-top:8px;letter-spacing:.04em}
.meta{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px;margin:40px 0 28px;padding:16px 0;border-top:1px solid #e7e2d6;border-bottom:1px solid #e7e2d6}
.meta small{display:block;text-transform:uppercase;font-size:9.5px;letter-spacing:.14em;color:#8a857a;font-weight:600;margin-bottom:4px}
.meta b{font-weight:600}
.obj{font:500 18px 'Newsreader';margin-bottom:16px}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:#8a857a;font-weight:600;padding:0 8px 8px;border-bottom:1.5px solid #1c1b18}
.t td{padding:11px 8px;border-bottom:1px solid #eeeae0;vertical-align:top}
.t td small{display:block;color:#8a857a;font-size:11px;margin-top:2px}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:flex;justify-content:space-between;gap:30px;margin-top:22px;align-items:flex-start}
.lettres{flex:1;font-size:11.5px;color:#57534a;padding-top:4px;max-width:330px}
.lettres em{font:italic 400 14px/1.4 'Newsreader';color:#1c1b18;display:block;margin-top:3px}
.sum{width:290px}.sum span:last-child{font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;padding:5px 0}
.sum .gr{border-top:1.5px solid #1c1b18;margin-top:6px;padding-top:10px;font-weight:700;font-size:16px}
.sum .gr span:last-child{color:var(--acc)}
.sum .ac{background:var(--teal2);margin:6px -10px 0;padding:7px 10px;border-radius:6px;font-weight:600}
.notes{margin-top:auto;padding-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:28px;font-size:11px;color:#57534a}
.notes h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:#8a857a;margin-bottom:5px}
.sig{border:1px dashed #cfc9bb;border-radius:6px;height:74px;margin-top:6px;display:grid;place-items:center;color:#a8a294;font-size:10.5px}
.pf{padding:14px 60px;font-size:9.5px;color:#8a857a;border-top:1px solid #eeeae0;display:flex;justify-content:space-between}
.stamp{position:absolute;top:170px;right:70px;border:3px solid currentColor;color:#15803d;font:700 22px 'Schibsted Grotesk';letter-spacing:.15em;padding:6px 14px;border-radius:8px;transform:rotate(-12deg);opacity:.7;display:none}
.paid .stamp{display:block}
/* gabarits */
.page.bandeau .dh{background:var(--acc);margin:-56px -60px 0;padding:44px 60px 34px;color:#fff}
.page.bandeau .em,.page.bandeau .tt h1{color:#fff}.page.bandeau .em{opacity:.85}
.page.marge{padding-left:150px}
.page.marge::before{content:"";position:absolute;left:0;top:0;bottom:0;width:150px;background:var(--acc)}
.page.marge .tt h1{position:absolute;left:0;top:56px;width:150px;writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:64px;display:flex;align-items:center;justify-content:flex-start;height:420px}
.page.marge .tt{text-align:left}
.page.marge .meta{grid-template-columns:1.3fr 1fr}
.page.marge .meta>div:nth-child(3){display:none}
/* liste */
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:var(--paper);box-shadow:-30px 0 60px rgba(0,0,0,.18);transform:translateX(105%);transition:.35s cubic-bezier(.2,.8,.2,1);z-index:20;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer h2{font:500 24px 'Newsreader'}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 20px}
.kpi div{background:var(--bg);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mute)}
.docs{overflow:auto;flex:1;padding:0 20px 20px}
.doc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.doc:hover b{color:var(--teal)}
.doc small{color:var(--mute)}
.doc .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;justify-self:end}
.pill.brouillon{background:#eee9dd;color:#6b665b}.pill.envoye{background:#dbeafe;color:#1e40af}.pill.paye{background:#dcfce7;color:#166534}.pill.retard{background:#fee2e2;color:#991b1b}.pill.accepte{background:#ede9fe;color:#5b21b6}
.veil{position:fixed;inset:0;background:rgba(28,27,24,.3);opacity:0;pointer-events:none;transition:.3s;z-index:15}.veil.on{opacity:1;pointer-events:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:500;transition:.35s;z-index:30}
.toast.on{transform:translate(-50%,0)}
@media (max-width:980px){.app{grid-template-columns:1fr;height:auto}.ed{border:0}.pv{padding:14px;overflow:hidden}.top{flex-wrap:wrap}.hide-m{display:none}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}.top,.ed,.drawer,.veil,.toast{display:none!important}
  .app{display:block;height:auto}.pv{padding:0;overflow:visible;display:block}.scale{transform:none!important;height:auto!important}
  .page{box-shadow:none;width:210mm;min-height:297mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><i></i>Ardoise</div>
  <div class="seg" id="kind"><button data-k="devis" class="on">Devis</button><button data-k="facture">Facture</button></div>
  <div class="sp"></div>
  <button class="b hide-m" id="nouveau"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>Nouveau</button>
  <button class="b" id="convert">Transformer en facture</button>
  <button class="b" id="list"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h10M3 8h10M3 12h6"/></svg>Mes documents</button>
  <button class="b p" id="pdf"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8m-3-3 3 3 3-3M3 13h10"/></svg>Enregistrer en PDF</button>
</div>
<div class="app">
  <div class="ed" id="ed">
    <div class="sec"><h3>Votre entreprise</h3>
      <div class="g">
        <label class="drop w" id="drop"><input type="file" accept="image/*" id="logo" hidden><img id="logoP" alt="" hidden><span id="logoT">Ajouter votre logo (PNG, JPG, SVG)</span></label>
        <label class="f w">Raison sociale<input data-b="emetteur.nom"></label>
        <label class="f w">Adresse<input data-b="emetteur.adresse"></label>
        <label class="f">Téléphone<input data-b="emetteur.tel"></label>
        <label class="f">E-mail<input data-b="emetteur.mail"></label>
        <label class="f">N° contribuable (NIU)<input data-b="emetteur.niu"></label>
        <label class="f">RCCM<input data-b="emetteur.rccm"></label>
      </div>
    </div>
    <div class="sec"><h3>Client</h3>
      <div class="g">
        <label class="f w">Nom ou société<input data-b="client.nom" list="clients"></label>
        <label class="f w">Adresse<input data-b="client.adresse"></label>
        <label class="f">Contact<input data-b="client.contact"></label>
        <label class="f">NIU (facultatif)<input data-b="client.niu"></label>
      </div>
      <datalist id="clients"></datalist>
    </div>
    <div class="sec"><h3>Document</h3>
      <div class="g">
        <label class="f">Numéro<input data-b="numero"></label>
        <label class="f">Date<input type="date" data-b="date"></label>
        <label class="f" id="echL">Validité (jours)<input type="number" min="1" data-b="delai"></label>
        <label class="f">Devise<select data-b="devise"><option value="XAF">FCFA (XAF)</option><option value="EUR">Euro (EUR)</option><option value="USD">Dollar (USD)</option></select></label>
        <label class="f w">Objet<input data-b="objet"></label>
      </div>
    </div>
    <div class="sec"><h3>Prestations <span id="nb" style="letter-spacing:0;text-transform:none;font-weight:500"></span></h3>
      <div class="lines" id="lines"></div>
      <button class="add" id="addL">+ Ajouter une ligne</button>
      <div class="cat" id="cat"></div>
    </div>
    <div class="sec"><h3>Taxes et conditions</h3>
      <div class="sw">TVA 19,25 % (17,5 % + CAC)<input type="checkbox" class="tg" data-b="tva"></div>
      <div class="sw">Retenue à la source (précompte 5,5 %)<input type="checkbox" class="tg" data-b="precompte"></div>
      <div class="g" style="margin-top:6px">
        <label class="f">Remise globale (%)<input type="number" min="0" max="100" step="0.5" data-b="remise"></label>
        <label class="f">Acompte demandé (%)<input type="number" min="0" max="100" step="5" data-b="acompte"></label>
        <label class="f w">Modalités de paiement<input data-b="paiement"></label>
        <label class="f w">Note au client<textarea data-b="note"></textarea></label>
      </div>
    </div>
    <div class="sec"><h3>Apparence</h3>
      <div class="tpl" id="tpl"><button data-t="classique"><i></i>Classique</button><button data-t="bandeau"><i></i>Bandeau</button><button data-t="marge"><i></i>Marge</button></div>
      <div class="sw" style="margin-top:10px">Couleur<div class="cols" id="cols"></div></div>
      <div class="sw">Statut<select data-b="statut" style="height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff"><option value="brouillon">Brouillon</option><option value="envoye">Envoyé</option><option value="accepte">Accepté</option><option value="paye">Payé</option></select></div>
    </div>
  </div>
  <div class="pv" id="pvw"><div class="scale" id="scale"><div class="page" id="page"></div></div></div>
</div>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="Mes documents"><header><h2>Mes documents</h2><button class="b" id="closeD">Fermer</button></header><div class="kpi" id="kpi"></div><div class="docs" id="docs"></div></aside>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// ——— Montant en lettres (règles françaises : vingt et un, quatre-vingts, cents, mille invariable) ———
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],D=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
function cent(n,fin){ // 0..999
  const c=Math.floor(n/100),r=n%100;let s='';
  if(c)s=(c>1?U[c]+' ':'')+'cent'+(c>1&&!r&&fin?'s':'');
  if(r){let d=Math.floor(r/10),u=r%10,t;
    if(r<20)t=U[r];
    else if(d===7||d===9)t=D[d]+(d===7&&u===1?' et ':'-')+U[10+u];
    else t=D[d]+(u===1&&d<8?' et un':u?'-'+U[u]:(d===8&&fin?'s':''));
    s+=(s?' ':'')+t}
  return s}
function lettres(n){n=Math.round(n);if(!n)return'zéro';let out=[],g=[[1e9,'milliard'],[1e6,'million'],[1e3,'mille']];
  for(const[v,w]of g){const q=Math.floor(n/v);if(q){out.push(w==='mille'?(q===1?'mille':cent(q,false)+' mille'):cent(q,true)+' '+w+(q>1?'s':''));n%=v}}
  if(n)out.push(cent(n,true));return out.join(' ')}
const DEV={XAF:{n:'francs CFA',d:0,s:'F CFA'},EUR:{n:'euros',d:2,s:'€'},USD:{n:'dollars',d:2,s:'$'}};
const fmt=(v,c=doc.devise)=>v.toLocaleString('fr-FR',{minimumFractionDigits:DEV[c].d,maximumFractionDigits:DEV[c].d}).replace(/ /g,' ')+' '+DEV[c].s;
const COL=['#0d4f4a','#1d3a8a','#7c2d12','#3f3f46','#86198f'];
const CAT=[['Création de logo','Trois pistes, deux allers-retours, fichiers sources',150000],['Site vitrine 5 pages','Responsive, référencement de base, formulaire',650000],['Hébergement + domaine (1 an)','Nom de domaine .cm, certificat SSL',60000],['Maintenance mensuelle','Mises à jour, sauvegardes, 2 h de modifications',45000],['Shooting produit','20 photos retouchées, fond neutre',120000]];

// ——— État ———
const today=()=>new Date().toISOString().slice(0,10);
const base=()=>({id:'d'+Date.now(),kind:'devis',numero:'',date:today(),delai:30,devise:'XAF',objet:'Refonte du site internet et identité visuelle',tpl:'classique',col:COL[0],statut:'brouillon',tva:true,precompte:false,remise:0,acompte:40,logo:'',
  emetteur:{nom:'Studio Makossa SARL',adresse:'Rue Joss, Bonanjo, Douala',tel:'+237 6 99 12 34 56',mail:'bonjour@studiomakossa.cm',niu:'M092312345678A',rccm:'RC/DLA/2021/B/4521'},
  client:{nom:'Brasseries du Littoral',adresse:'Zone industrielle de Bassa, Douala',contact:'Mme Carine Ebongue',niu:''},
  paiement:'Virement (Afriland First Bank) ou Orange Money / MTN MoMo',note:'Merci pour votre confiance. Le planning démarre à réception de l\'acompte.',
  lignes:[{l:'Atelier de cadrage',d:'Une demi-journée avec votre équipe marketing',q:1,p:180000},{l:'Identité visuelle',d:'Logo, palette, typographies, charte de 12 pages',q:1,p:450000},{l:'Site vitrine 6 pages',d:'Design sur mesure, responsive, bilingue FR / EN',q:1,p:900000},{l:'Rédaction des contenus',d:'Par page, optimisée pour le référencement',q:6,p:25000}]});
let store;try{store=JSON.parse(localStorage.getItem('ardoise'))}catch(e){}
if(!store||!store.docs){store={docs:[],seq:{devis:41,facture:117}};
  // historique d'exemple
  const H=[['facture','Hôtel La Falaise','Menus et signalétique',1240000,'paye',-58],['facture','Clinique Odyssée','Site et prise de rendez-vous',2150000,'retard',-41],['devis','Brasseries du Littoral','Campagne de lancement',3600000,'accepte',-20],['facture','Café Terroir','Packaging 3 références',780000,'envoye',-9],['devis','Collège Libermann','Application de notes',4200000,'envoye',-4]];
  H.forEach(([k,c,o,t,s,dd],i)=>{const d=base();d.id='h'+i;d.kind=k;d.client.nom=c;d.objet=o;d.statut=s;d.date=new Date(Date.now()+dd*864e5).toISOString().slice(0,10);d.lignes=[{l:o,d:'',q:1,p:t}];d.numero=num(k,store.seq[k]++,d.date);store.docs.push(d)})}
function num(k,n,date){return(k==='devis'?'DEV-':'FAC-')+date.slice(0,4)+'-'+String(n).padStart(4,'0')}
let doc=base();doc.numero=num('devis',store.seq.devis,doc.date);
const save=()=>{try{localStorage.setItem('ardoise',JSON.stringify(store))}catch(e){}};
function persist(){const i=store.docs.findIndex(d=>d.id===doc.id);if(i<0){store.docs.unshift(doc);store.seq[doc.kind]++}else store.docs[i]=doc;save()}

// ——— Calculs ———
function calc(d=doc){const ht=d.lignes.reduce((s,l)=>s+(+l.q||0)*(+l.p||0),0),rem=ht*(+d.remise||0)/100,net=ht-rem,tva=d.tva?net*.1925:0,ttc=net+tva,pre=d.precompte?net*.055:0,apayer=ttc-pre,ac=apayer*(+d.acompte||0)/100;return{ht,rem,net,tva,ttc,pre,apayer,ac}}

// ——— Formulaire ———
const get=(o,p)=>p.split('.').reduce((a,k)=>a[k],o),set=(o,p,v)=>{const k=p.split('.');const last=k.pop();k.reduce((a,x)=>a[x],o)[last]=v};
function fill(){$$('[data-b]').forEach(el=>{const v=get(doc,el.dataset.b);if(el.type==='checkbox')el.checked=v;else el.value=v??''});
  $$('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.k===doc.kind));$$('#tpl button').forEach(b=>b.classList.toggle('on',b.dataset.t===doc.tpl));
  $('#cols').innerHTML=COL.map(c=>`<button style="background:${c}" data-c="${c}" class="${c===doc.col?'on':''}" aria-label="Couleur ${c}"></button>`).join('');
  $('#echL').firstChild.textContent=doc.kind==='devis'?'Validité (jours)':'Échéance (jours)';
  $('#convert').style.display=doc.kind==='devis'?'':'none';
  $('#logoP').hidden=!doc.logo;$('#logoP').src=doc.logo||'';$('#logoT').textContent=doc.logo?'Changer le logo':'Ajouter votre logo (PNG, JPG, SVG)';
  $('#clients').innerHTML=[...new Set(store.docs.map(d=>d.client.nom))].map(n=>`<option value="${n}">`).join('');
  drawLines();render()}
$('#ed').addEventListener('input',e=>{const el=e.target;if(el.dataset.b){set(doc,el.dataset.b,el.type==='checkbox'?el.checked:el.type==='number'?+el.value:el.value);
    if(el.dataset.b==='client.nom'){const p=store.docs.find(d=>d.client.nom===el.value&&d.id!==doc.id);if(p){doc.client={...p.client};fill();return}}
    render()}
  const ln=el.closest('.ln');if(ln&&el.dataset.k){const l=doc.lignes[+ln.dataset.i];l[el.dataset.k]=el.classList.contains('n')?+el.value.replace(/\s/g,'').replace(',','.')||0:el.value;render()}});
function drawLines(){$('#lines').innerHTML=doc.lignes.map((l,i)=>`<div class="ln" data-i="${i}"><input data-k="l" value="${esc(l.l)}" placeholder="Désignation" aria-label="Désignation"><input class="n" data-k="q" value="${l.q}" aria-label="Quantité"><input class="n" data-k="p" value="${l.p}" aria-label="Prix unitaire"><button class="x" aria-label="Supprimer la ligne">×</button><input class="d" data-k="d" value="${esc(l.d)}" placeholder="Détail (facultatif)" aria-label="Détail"></div>`).join('')}
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
$('#lines').onclick=e=>{if(e.target.classList.contains('x')){doc.lignes.splice(+e.target.closest('.ln').dataset.i,1);drawLines();render()}};
$('#addL').onclick=()=>{doc.lignes.push({l:'',d:'',q:1,p:0});drawLines();render();$('#lines .ln:last-child input').focus()};
$('#cat').innerHTML=CAT.map((c,i)=>`<button data-i="${i}">+ ${c[0]}</button>`).join('');
$('#cat').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=CAT[+b.dataset.i];doc.lignes.push({l:c[0],d:c[1],q:1,p:c[2]});drawLines();render()};
$('#tpl').onclick=e=>{const b=e.target.closest('button');if(b){doc.tpl=b.dataset.t;fill()}};
$('#cols').onclick=e=>{const b=e.target.closest('button');if(b){doc.col=b.dataset.c;fill()}};
$('#kind').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.k===doc.kind)return;doc.kind=b.dataset.k;doc.numero=num(doc.kind,store.seq[doc.kind],doc.date);fill()};
$('#logo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{doc.logo=r.result;fill()};r.readAsDataURL(f)};

// ——— Aperçu ———
function render(){const c=calc(),dv=DEV[doc.devise],isD=doc.kind==='devis',ech=new Date(new Date(doc.date).getTime()+(+doc.delai||0)*864e5);
  const fd=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  const p=$('#page');p.className='page '+doc.tpl+(doc.statut==='paye'&&!isD?' paid':'');p.style.setProperty('--acc',doc.col);
  $('#nb').textContent=doc.lignes.length+' ligne'+(doc.lignes.length>1?'s':'');
  const ent=Math.floor(c.apayer),dec=Math.round((c.apayer-ent)*100);
  p.innerHTML=`<div class="stamp">PAYÉE</div><div class="in">
  <div class="dh"><div class="em">${doc.logo?`<img src="${doc.logo}" alt="">`:''}<b>${esc(doc.emetteur.nom)}</b>${esc(doc.emetteur.adresse)}<br>${esc(doc.emetteur.tel)} · ${esc(doc.emetteur.mail)}<br>NIU ${esc(doc.emetteur.niu)} · ${esc(doc.emetteur.rccm)}</div>
  <div class="tt"><h1>${isD?'Devis':'Facture'}</h1><div class="num">N° ${esc(doc.numero)}</div></div></div>
  <div class="meta"><div><small>${isD?'Destinataire':'Facturé à'}</small><b>${esc(doc.client.nom)}</b><br>${esc(doc.client.adresse)}${doc.client.contact?'<br>À l\'attention de '+esc(doc.client.contact):''}${doc.client.niu?'<br>NIU '+esc(doc.client.niu):''}</div>
  <div><small>Date d'émission</small>${fd(doc.date)}</div><div><small>${isD?'Valable jusqu\'au':'Échéance'}</small>${fd(ech)}</div></div>
  ${doc.objet?`<div class="obj">${esc(doc.objet)}</div>`:''}
  <table class="t"><thead><tr><th style="width:52%">Désignation</th><th class="r">Qté</th><th class="r">Prix unitaire</th><th class="r">Total HT</th></tr></thead><tbody>
  ${doc.lignes.map(l=>`<tr><td>${esc(l.l)||'<span style="color:#bbb">Nouvelle ligne</span>'}${l.d?`<small>${esc(l.d)}</small>`:''}</td><td class="r">${l.q}</td><td class="r">${fmt(+l.p||0)}</td><td class="r">${fmt((+l.q||0)*(+l.p||0))}</td></tr>`).join('')}</tbody></table>
  <div class="tot"><div class="lettres">Arrêté${isD?' le présent devis':'e la présente facture'} à la somme de :<em>${lettres(ent).replace(/^./,m=>m.toUpperCase())} ${dv.n}${dec?' et '+lettres(dec)+' centimes':''}${doc.tva?' toutes taxes comprises':''}.</em></div>
  <div class="sum"><div><span>Total HT</span><span>${fmt(c.ht)}</span></div>
  ${c.rem?`<div><span>Remise ${doc.remise} %</span><span>− ${fmt(c.rem)}</span></div><div><span>Net HT</span><span>${fmt(c.net)}</span></div>`:''}
  ${doc.tva?`<div><span>TVA 19,25 %</span><span>${fmt(c.tva)}</span></div>`:''}
  ${c.pre?`<div><span>Précompte 5,5 %</span><span>− ${fmt(c.pre)}</span></div>`:''}
  <div class="gr"><span>Net à payer</span><span>${fmt(c.apayer)}</span></div>
  ${c.ac&&isD?`<div class="ac"><span>Acompte à la commande (${doc.acompte} %)</span><span>${fmt(c.ac)}</span></div>`:''}</div></div>
  <div class="notes"><div><h4>Paiement</h4>${esc(doc.paiement)}${doc.note?`<h4 style="margin-top:12px">Note</h4>${esc(doc.note)}`:''}</div><div>${isD?'<h4>Bon pour accord</h4>Date, signature et cachet du client<div class="sig">Signature</div>':'<h4>Pénalités</h4>En cas de retard de paiement, des pénalités de 1,5 % par mois pourront être appliquées, conformément à l\'Acte uniforme OHADA.'}</div></div>
  </div><div class="pf"><span>${esc(doc.emetteur.nom)} · ${esc(doc.emetteur.rccm)}</span><span>Page 1 / 1</span></div>`;
  fit();persist()}
function fit(){const w=$('#pvw').clientWidth-(innerWidth<980?28:56),s=Math.min(1,w/794);$('#scale').style.transform=`scale(${s})`;$('#scale').style.height=1123*s+'px'}
addEventListener('resize',fit);

// ——— Actions ———
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('on'),2400)}
$('#pdf').onclick=()=>{document.title=doc.numero+' '+doc.client.nom;window.print();document.title='Ardoise — Devis et factures en deux minutes'};
$('#convert').onclick=()=>{doc.statut='accepte';persist();const f=JSON.parse(JSON.stringify(doc));f.id='d'+Date.now();f.kind='facture';f.statut='brouillon';f.date=today();f.numero=num('facture',store.seq.facture,f.date);f.note='Facture établie d\'après le devis '+doc.numero+'. Merci pour votre confiance.';doc=f;fill();toast('Devis accepté et transformé en facture '+f.numero)};
$('#nouveau').onclick=()=>{doc=base();doc.lignes=[{l:'',d:'',q:1,p:0}];doc.client={nom:'',adresse:'',contact:'',niu:''};doc.objet='';doc.numero=num('devis',store.seq.devis,doc.date);fill();toast('Nouveau devis')};
const openD=on=>{$('#drawer').classList.toggle('on',on);$('#veil').classList.toggle('on',on);if(on)drawDocs()};
$('#list').onclick=()=>openD(true);$('#closeD').onclick=$('#veil').onclick=()=>openD(false);
function drawDocs(){const F=store.docs.filter(d=>d.kind==='facture'),sum=a=>a.reduce((s,d)=>s+calc(d).apayer,0);
  const enc=sum(F.filter(d=>d.statut==='paye')),att=sum(F.filter(d=>d.statut!=='paye')),ret=F.filter(d=>d.statut==='retard').length,dv=store.docs.filter(d=>d.kind==='devis'),acc=dv.filter(d=>d.statut==='accepte').length;
  $('#kpi').innerHTML=`<div><b>${fmt(enc,'XAF')}</b><span>encaissé</span></div><div><b>${fmt(att,'XAF')}</b><span>en attente${ret?' · '+ret+' en retard':''}</span></div><div><b>${dv.length}</b><span>devis émis</span></div><div><b>${dv.length?Math.round(acc/dv.length*100):0} %</b><span>taux d'acceptation</span></div>`;
  const L={brouillon:'Brouillon',envoye:'Envoyé',paye:'Payée',retard:'En retard',accepte:'Accepté'};
  $('#docs').innerHTML=store.docs.map(d=>`<div class="doc" data-id="${d.id}"><b>${esc(d.client.nom)||'Sans client'}</b><span class="r">${fmt(calc(d).apayer,d.devise)}</span><small>${d.numero} · ${new Date(d.date).toLocaleDateString('fr-FR')}</small><span class="pill ${d.statut}">${L[d.statut]}</span></div>`).join('')}
$('#docs').onclick=e=>{const r=e.target.closest('.doc');if(!r)return;doc=store.docs.find(d=>d.id===r.dataset.id);openD(false);fill()};
fill();
</script>
</body>
</html>
